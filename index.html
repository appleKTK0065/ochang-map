<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오창 매물 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 빌라 원룸 매물장과 같은 색. 지도 전체 화면 + 위 도구줄 + 오른쪽(핸드폰은 아래) 목록 */
:root{
  --bg:#eef2f3; --panel:#ffffff; --fg:#172126; --muted:#5a6a72; --line:#d6dee2; --line-soft:#e7ecee;
  --accent:#1d6b86; --accent-fg:#ffffff; --accent-soft:#e3eff3; --row-hover:#f4f8f9;
  --pin:#e0182d; --pin-ring:#ffffff; --warn:#8a5a1c; --warn-bg:#f5ead9; --danger:#b42335;
  --font:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#11181b; --panel:#182226; --fg:#e3eaed; --muted:#93a3aa; --line:#2b383d; --line-soft:#223035;
  --accent:#5fb3d0; --accent-fg:#0d1a1f; --accent-soft:#1d3640; --row-hover:#1d2a2f;
  --warn:#e6b373; --warn-bg:#3a2c19; --danger:#f08a96; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.top h1{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.top h1 i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--pin);box-shadow:0 0 0 2px var(--pin-ring),0 0 0 3px var(--pin)}
.cnt{font-size:13px;color:var(--muted);margin-right:auto}
.cnt b{color:var(--fg);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:none;background:var(--panel);padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:700}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--row-hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px}
#map{min-width:0;min-height:0;background:var(--line-soft)}
.side{min-height:0;overflow:auto;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
.side h2{margin:0;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.03em;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.grp{border:none;border-bottom:1px solid var(--line-soft);background:transparent;text-align:left;padding:9px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;width:100%}
.grp:hover{background:var(--row-hover)}
.grp.on{background:var(--accent-soft)}
.grp .t{font-weight:700;display:flex;gap:6px;align-items:center}
.grp .t i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--pin)}
.grp .t.miss i{background:var(--muted)}
.grp .a{font-size:12px;color:var(--muted)}
.grp .r{font-size:12.5px;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted);margin:0;padding:10px 14px}
.warn{margin:0;padding:8px 14px;background:var(--warn-bg);color:var(--warn);font-size:12.5px}

/* 지도 위 빨간 점 */
.pin{position:relative;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.pin .dot{width:18px;height:18px;border-radius:50%;background:var(--pin);border:3px solid var(--pin-ring);box-shadow:0 1px 4px rgba(0,0,0,.45)}
.pin .n{position:absolute;top:-9px;left:10px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#fff;color:var(--pin);font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.pin .lb{margin-top:3px;padding:1px 6px;border-radius:4px;background:rgba(255,255,255,.92);color:#172126;font-size:11.5px;font-weight:700;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pin.on .dot{width:24px;height:24px}
.info{transform:translate(-50%,calc(-100% - 22px));background:#fff;color:#172126;border-radius:9px;box-shadow:0 4px 16px rgba(0,0,0,.35);padding:10px 12px;min-width:220px;max-width:300px;font-family:var(--font);font-size:13px;line-height:1.45}
.info h3{margin:0 0 2px;font-size:14.5px;display:flex;justify-content:space-between;gap:8px}
.info h3 button{border:none;background:none;cursor:pointer;font-size:15px;color:#5a6a72;padding:0 2px}
.info .a{color:#5a6a72;font-size:12px;margin-bottom:6px}
.info ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.info li{display:flex;gap:6px;font-variant-numeric:tabular-nums}
.info li b{color:#e0182d;min-width:42px}
.info a{display:inline-block;margin-top:8px;color:#0a8a43;font-weight:700;text-decoration:none;font-size:12.5px}

/* 처음 설정 / 오류 안내 */
.setup{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;display:flex;justify-content:center;align-items:flex-start;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:620px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:17px}
.card p{margin:0}
.card ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.card code{background:var(--accent-soft);border-radius:4px;padding:1px 5px;font-size:13px;word-break:break-all}
.card input{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:9px;font-size:16px}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--danger);font-weight:600}

@media (max-width:760px){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .side{border-left:none;border-top:1px solid var(--line);max-height:38vh;padding-bottom:env(safe-area-inset-bottom,0px)}
  .side.closed{max-height:none}
  .side.closed .list{display:none}
  .cnt{width:100%;order:3;margin-right:0}
  .seg button,.btn{padding:8px 12px;font-size:14px}
}
</style>
</head>
<body>
<header class="top">
  <h1><i aria-hidden="true"></i>오창 매물 지도</h1>
  <span class="cnt" id="cnt">불러오는 중…</span>
  <div class="seg" role="group" aria-label="지도 종류">
    <button type="button" id="tSky" aria-pressed="true">위성</button><button type="button" id="tRoad" aria-pressed="false">일반</button>
  </div>
  <button type="button" class="btn" id="tCad" aria-pressed="true">지적도 켜짐</button>
  <button type="button" class="btn" id="tFit">매물 전체 보기</button>
</header>
<div class="main">
  <div id="map" role="application" aria-label="오창읍 지도"></div>
  <aside class="side" id="side">
    <h2 id="sideHead">지번 목록</h2>
    <div class="list" id="list"></div>
  </aside>
</div>
<div class="setup" id="setup" hidden><div class="card" id="setupCard"></div></div>

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store=(k,v)=>{ try{ if(v===undefined)return localStorage.getItem(k); if(v===null)localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } };
const fmt=n=>n==null||n===''?'':Number(n).toLocaleString('ko-KR');
const OCHANG={lat:36.7175,lng:127.4302};

// ---- 매물장에서 넘어온 자료 (#뒤에 실려 옴) → 이 기기에 보관, 주소창에서는 지움 ----
function decode(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4)s+='='; const bin=atob(s);
  const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i); return JSON.parse(new TextDecoder().decode(bytes)); }
let payload=null;
if(location.hash.length>1){ try{ payload=decode(location.hash.slice(1)); store('om-data',JSON.stringify(payload)); if(payload.k)store('om-key',payload.k); }catch(e){} history.replaceState(null,'',location.pathname+location.search); }
if(!payload){ try{ payload=JSON.parse(store('om-data')||'null'); }catch(e){} }
const KEY=(payload&&payload.k)||store('om-key')||'';

function showSetup(html){ $('setupCard').innerHTML=html; $('setup').hidden=false; }
function keyForm(msg){
  showSetup(`<h2>카카오 지도 연결</h2>${msg?`<p class="err">${msg}</p>`:''}
    <p>빌라 원룸 매물장 왼쪽 위 <b>⚙</b>에 카카오 JavaScript 키를 넣고 <b>통합지도</b>를 누르면 자동으로 열립니다. 여기에 직접 넣어도 됩니다.</p>
    <input id="keyIn" placeholder="카카오 JavaScript 키 (영문·숫자 32자)" autocomplete="off" value="${esc(KEY)}">
    <div class="row"><button class="btn primary" id="keySave" type="button">저장하고 지도 열기</button></div>
    <p class="note" style="padding:0">이 지도 주소: <code>${esc(location.origin)}</code> — 카카오 개발자 사이트의 Web 플랫폼 사이트 도메인에 이 주소가 들어 있어야 합니다.</p>`);
  $('keySave').onclick=()=>{ const k=$('keyIn').value.trim(); if(!/^[0-9a-f]{32}$/i.test(k)){ alertIn('키는 영문·숫자 32자입니다. 카카오 개발자 사이트 > 앱 키 > JavaScript 키를 복사해 주세요.'); return; } store('om-key',k); location.reload(); };
}
function alertIn(m){ let p=$('setupCard').querySelector('.err'); if(!p){ p=document.createElement('p'); p.className='err'; $('setupCard').insertBefore(p,$('setupCard').children[1]); } p.textContent=m; }

if(!KEY){ keyForm(''); return; }

// ---- 카카오 지도 불러오기 ----
let loadedOk=false;
const failTimer=setTimeout(()=>{ if(!loadedOk)domainHelp(); },9000);
function domainHelp(){
  showSetup(`<h2>카카오 지도가 열리지 않습니다</h2>
    <p>대부분 아래 중 하나입니다.</p>
    <ol><li>카카오 개발자 사이트 > 내 애플리케이션 > <b>플랫폼 > Web</b>의 사이트 도메인에 <code>${esc(location.origin)}</code> 이 등록돼 있는지</li>
    <li><b>앱 설정 > 카카오맵</b> 사용 설정이 켜져 있는지 (보이는 경우)</li>
    <li>넣은 키가 <b>JavaScript 키</b>가 맞는지 (REST API 키가 아님)</li></ol>
    <p>고친 뒤 1~2분 기다렸다가 다시 열어 보세요.</p>
    <div class="row"><button class="btn primary" type="button" onclick="location.reload()">다시 열기</button><button class="btn" type="button" id="reKey">키 다시 넣기</button></div>`);
  $('reKey').onclick=()=>{ store('om-key',null); keyForm(''); };
}
const sc=document.createElement('script');
sc.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(KEY)}&libraries=services&autoload=false`;
sc.onerror=()=>{ clearTimeout(failTimer); domainHelp(); };
sc.onload=()=>{ if(!window.kakao||!kakao.maps){ domainHelp(); return; } kakao.maps.load(()=>{ loadedOk=true; clearTimeout(failTimer); start(); }); };
document.head.appendChild(sc);

function start(){
  const K=kakao.maps;
  const map=new K.Map($('map'),{center:new K.LatLng(OCHANG.lat,OCHANG.lng),level:6});
  map.setMapTypeId(K.MapTypeId.HYBRID);
  let cad=true; map.addOverlayMapTypeId(K.MapTypeId.USE_DISTRICT);
  map.addControl(new K.ZoomControl(),K.ControlPosition.RIGHT);
  const setType=sky=>{ map.setMapTypeId(sky?K.MapTypeId.HYBRID:K.MapTypeId.ROADMAP); $('tSky').setAttribute('aria-pressed',sky); $('tRoad').setAttribute('aria-pressed',!sky); };
  $('tSky').onclick=()=>setType(true); $('tRoad').onclick=()=>setType(false);
  $('tCad').onclick=()=>{ cad=!cad; cad?map.addOverlayMapTypeId(K.MapTypeId.USE_DISTRICT):map.removeOverlayMapTypeId(K.MapTypeId.USE_DISTRICT);
    $('tCad').setAttribute('aria-pressed',cad); $('tCad').textContent=cad?'지적도 켜짐':'지적도 꺼짐'; };

  const rows=(payload&&Array.isArray(payload.p))?payload.p:[];
  const when=payload&&payload.t?new Date(payload.t):null;
  if(!rows.length){ $('cnt').innerHTML='표시할 매물이 없습니다'; $('list').innerHTML='<p class="note">빌라 원룸 매물장에서 왼쪽 위 <b>통합지도</b> 아이콘을 누르면 매물이 빨간 점으로 표시됩니다.</p>'; return; }

  // 같은 지번끼리 묶기
  const groups=new Map(); rows.forEach(r=>{ if(!r.a)return; if(!groups.has(r.a))groups.set(r.a,{addr:r.a,rows:[]}); groups.get(r.a).rows.push(r); });
  const G=[...groups.values()];
  $('cnt').innerHTML=`공실 <b>${rows.length}</b>건 · 지번 <b>${G.length}</b>곳${payload.f?' <span>(매물장 필터 적용)</span>':''}${when?` · ${when.getMonth()+1}/${when.getDate()} ${String(when.getHours()).padStart(2,'0')}:${String(when.getMinutes()).padStart(2,'0')} 기준`:''}`;

  const geocoder=new K.services.Geocoder(); const places=new K.services.Places();
  let cache={}; try{ cache=JSON.parse(store('om-geo')||'{}'); }catch(e){}
  const saveCache=()=>store('om-geo',JSON.stringify(cache));
  function locate(g){ return new Promise(res=>{
    if(cache[g.addr])return res(cache[g.addr]);
    geocoder.addressSearch(g.addr,(r,st)=>{
      if(st===K.services.Status.OK&&r.length){ const p={lat:+r[0].y,lng:+r[0].x}; cache[g.addr]=p; saveCache(); return res(p); }
      const v=g.rows[0].v; if(!v)return res(null);
      places.keywordSearch(`오창 ${v}`,(r2,st2)=>{ if(st2===K.services.Status.OK&&r2.length){ const p={lat:+r2[0].y,lng:+r2[0].x,approx:true}; cache[g.addr]=p; saveCache(); res(p); } else res(null); },
        {location:new K.LatLng(OCHANG.lat,OCHANG.lng),radius:8000});
    }); }); }

  let info=null, active=null;
  function roomsHtml(g){ return g.rows.map(r=>`<li><b>${esc(r.u?r.u+'호':'-')}</b><span>${esc([r.t?r.t+'룸':'',r.l].filter(Boolean).join(' '))} · ${fmt(r.d)}/${fmt(r.r)}${r.f?` · 관리 ${esc(r.f)}`:''}${r.m?` · ${esc(r.m)}`:''}</span></li>`).join(''); }
  function open(g,noPan){
    if(!g.pos)return; if(info)info.setMap(null);
    if(active&&active.el)active.el.classList.remove('on'); active=g; if(g.el)g.el.classList.add('on');
    document.querySelectorAll('.grp').forEach(b=>b.classList.toggle('on',b.dataset.a===g.addr));
    const villas=[...new Set(g.rows.map(r=>r.v).filter(Boolean))].join(', ');
    const el=document.createElement('div'); el.className='info';
    el.innerHTML=`<h3><span>${esc(villas||g.rows[0].j||'')}</span><button type="button" aria-label="닫기">✕</button></h3>
      <div class="a">${esc(g.addr)}${g.pos.approx?' (빌라명으로 찾은 근사 위치)':''}</div><ul>${roomsHtml(g)}</ul>
      <a href="https://map.naver.com/p/search/${encodeURIComponent(g.addr)}" target="_blank" rel="noopener">N 네이버지도에서 보기</a>`;
    el.querySelector('button').onclick=()=>{ info.setMap(null); info=null; if(active&&active.el)active.el.classList.remove('on'); };
    info=new K.CustomOverlay({position:new K.LatLng(g.pos.lat,g.pos.lng),content:el,yAnchor:0,zIndex:10}); info.setMap(map);
    if(!noPan)map.panTo(new K.LatLng(g.pos.lat,g.pos.lng));
  }
  function renderList(){
    const miss=G.filter(g=>g.done&&!g.pos).length;
    $('sideHead').textContent=`지번 목록 · ${G.length}곳${miss?` (위치 못 찾음 ${miss})`:''}`;
    $('list').innerHTML=G.map(g=>`<button type="button" class="grp" data-a="${esc(g.addr)}"><span class="t${g.done&&!g.pos?' miss':''}"><i></i>${esc([...new Set(g.rows.map(r=>r.v).filter(Boolean))].join(', ')||g.addr)}</span>
      <span class="a">${esc(g.addr)}${g.done&&!g.pos?' · 지도에서 위치를 못 찾았습니다':''}${g.pos&&g.pos.approx?' · 근사 위치':''}</span>
      <span class="r">${g.rows.map(r=>`${esc(r.u||'')} ${fmt(r.d)}/${fmt(r.r)}`).join(' · ')}</span></button>`).join('');
  }
  $('list').onclick=e=>{ const b=e.target.closest('.grp'); if(!b)return; const g=G.find(x=>x.addr===b.dataset.a); if(g&&g.pos){ map.setLevel(Math.min(map.getLevel(),3)); open(g); } };
  function fitAll(){ const pts=G.filter(g=>g.pos); if(!pts.length)return; const bd=new K.LatLngBounds(); pts.forEach(g=>bd.extend(new K.LatLng(g.pos.lat,g.pos.lng))); map.setBounds(bd,60,60,60,60); if(pts.length===1)map.setLevel(3); }
  $('tFit').onclick=fitAll;
  renderList();
  // 하나씩 차례로 위치 찾기 (같은 주소는 이 기기에 저장돼 다음부터 바로 표시)
  (async()=>{ for(const g of G){ g.pos=await locate(g); g.done=true;
      if(g.pos){ const el=document.createElement('div'); el.className='pin'; el.title=g.addr;
        const villa=g.rows[0].v||g.rows[0].j||'';
        el.innerHTML=`<span class="dot"></span>${g.rows.length>1?`<span class="n">${g.rows.length}</span>`:''}<span class="lb">${esc(villa)}</span>`;
        el.onclick=()=>open(g); g.el=el;
        // PC: 빨간 점에 마우스를 올리기만 해도 상세가 뜸 (지도는 움직이지 않음)
        el.onmouseenter=()=>{ if(matchMedia('(hover:hover)').matches&&active!==g)open(g,true); };
        new K.CustomOverlay({position:new K.LatLng(g.pos.lat,g.pos.lng),content:el,yAnchor:0.5,zIndex:3}).setMap(map); }
      renderList(); }
    fitAll(); })();
}
})();
</script>
</body>
</html>
